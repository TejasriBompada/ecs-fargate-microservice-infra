name: Terraform Manual Plan

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to plan (dev/prod)"
        required: true
        default: "dev"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env || 'dev' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_ENV: ${{ github.event.inputs.env || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="envs/${TF_ENV}/backend.conf" -reconfigure

      - name: Terraform Plan
        run: |
          terraform plan -var-file="envs/${TF_ENV}/terraform.tfvars"
